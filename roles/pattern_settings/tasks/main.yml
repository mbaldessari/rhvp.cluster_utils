---
- name: Resolve defaults with ansible var/env var overrides
  ansible.builtin.import_tasks: resolve_overrides.yml

- name: Find all possible values-global.yaml files in values subdirectories
  ansible.builtin.find:
    paths: "{{ pattern_dir }}/values"
    patterns: "values-global.yaml"
    recurse: true
    file_type: file
  register: values_global_find_result
  ignore_errors: true

- name: Set values-global.yaml search paths
  ansible.builtin.set_fact:
    values_global_search_paths: >-
      {{
        (["{{ pattern_dir }}/values-global.yaml"] +
         (values_global_find_result.files | default([]) | map(attribute='path') | list) +
         ["{{ pattern_dir }}/values/values-global.yaml"]) | unique
      }}

- name: Find first existing values-global.yaml file
  ansible.builtin.set_fact:
    values_global_file: "{{ lookup('ansible.builtin.first_found', values_global_search_paths, skip=true) }}"

- name: Ensure values-global.yaml file was found
  ansible.builtin.assert:
    that:
      - values_global_file is defined
      - values_global_file | default('') | length > 0
    fail_msg: >-
      No values-global.yaml file could be found. Searched:
      {{ values_global_search_paths | join(', ') }}.

- name: Load values-global.yaml
  ansible.builtin.set_fact:
    values_global: "{{ lookup('file', values_global_file) | from_yaml }}"

- name: Ensure .global.pattern is set
  ansible.builtin.assert:
    that: (values_global.global.pattern | default('') | string | trim) != ""
    fail_msg: |
      values-global.yaml does not define .global.pattern.
      Please set a value for pattern under the 'global' key.

- name: Resolve pattern_name
  ansible.builtin.set_fact:
    pattern_name: >-
      {{
        pattern_name
          | default(lookup("env","PATTERN_NAME"), true)
          | default((values_global.global.pattern | string | trim), true)
      }}

- name: Set helper booleans for main.clusterGroupName and main.variant
  ansible.builtin.set_fact:
    _has_clustergroupname: "{{ (values_global.main.clusterGroupName | default('') | string | trim) != '' }}"
    _has_variant: "{{ (values_global.main.variant | default('') | string | trim) != '' }}"

- name: Ensure exactly one of main.clusterGroupName or main.variant is set
  ansible.builtin.assert:
    that:
      - _has_clustergroupname or _has_variant
      - not (_has_clustergroupname and _has_variant)
    fail_msg: |
      values-global.yaml must define exactly one of .main.clusterGroupName or .main.variant (not both).
      Please set one of these values under the 'main' key.

- name: Set fact for main variant
  ansible.builtin.set_fact:
    main_variant: >-
      {{ (values_global.main.clusterGroupName if _has_clustergroupname else values_global.main.variant) | string | trim }}
