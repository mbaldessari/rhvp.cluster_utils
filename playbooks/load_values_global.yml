---
- name: Get pattern_dir
  ansible.builtin.import_playbook: ./determine_pattern_dir.yml

- name: Load values global file
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Set pattern_dir fact
      ansible.builtin.set_fact:
        pattern_dir: '{{ pattern_dir }}'

    - name: Set values-global.yaml search paths
      ansible.builtin.set_fact:
        values_global_search_paths:
          - "{{ pattern_dir }}/values-global.yaml"
          - "{{ pattern_dir }}/values/values-global.yaml"

    - name: Find first existing values-global.yaml file
      ansible.builtin.set_fact:
        values_global_file: "{{ lookup('ansible.builtin.first_found', values_global_search_paths, skip=true) }}"

    - name: Ensure values-global.yaml file was found
      ansible.builtin.assert:
        that:
          - values_global_file is defined
          - values_global_file | default('') | length > 0
        fail_msg: >-
          No values-global.yaml file could be found. Searched:
          {{ values_global_search_paths | join(', ') }}.

    - name: Load values-global.yaml
      ansible.builtin.set_fact:
        values_global: "{{ lookup('file', values_global_file) | from_yaml }}"
